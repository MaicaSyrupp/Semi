<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | My Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="brand">My Portfolio</a>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="card auth-card">
      <h2>Welcome Back</h2>
      <p class="sub">Log in to your account</p>
      <div id="alert" class="alert"></div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-block" type="submit">Login</button>
      </form>
      <p class="form-footer">No account yet? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <footer><div class="container">Semi-Final Examination — Web Development</div></footer>

  <script src="js/auth.js"></script>
  <script>
    const alertBox = document.getElementById("alert");
    const params = new URLSearchParams(location.search);
    if (params.get("registered")) {
      alertBox.className = "alert alert-success show";
      alertBox.textContent = "Registration successful! You can now log in.";
    }
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      if (!username.trim() || !password) {
        alertBox.className = "alert alert-error show";
        alertBox.textContent = "Please enter both username and password.";
        return;
      }
      try {
        const user = await login(username, password);
        location.href = user.role === "admin" ? "admin.html" : "dashboard.html";
      } catch (err) {
        alertBox.className = "alert alert-error show";
        alertBox.textContent = err.message;
      }
    });
  </script>
</body>
</html>
